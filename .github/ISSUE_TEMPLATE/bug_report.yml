name: Bug report
description: Something in the editor does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Steps, the editor options you pass, and the smallest document (`editor.getJSON()`) that shows the problem.
      render: js
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: '0.1.0'
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser and OS
      placeholder: Chrome 140 on Windows 11; Safari on iOS 19; …
    validations:
      required: true
  - type: dropdown
    id: integration
    attributes:
      label: Integration
      options: [Plain HTML / JS, React, Vue 3, Headless (core only), Other]
