# Publishes a release when a version tag (v1.2.3, v1.3.0-beta.0, …) is pushed:
#   1. verifies the tag matches packages/zeditor/package.json and CHANGELOG.md has an entry for it
#   2. builds and tests
#   3. publishes to npm with provenance ("next" dist-tag for pre-releases, "latest" otherwise)
#   4. creates the GitHub release with the changelog section as notes and the tarball attached
# Set up once: add an npm automation token as the repository secret NPM_TOKEN, or configure
# npm "trusted publishing" for this repository and workflow (then no token is needed).
# See RELEASING.md.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Check tag, package version and changelog
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME}" --check

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm docs:check
      - run: pnpm test

      - name: Release notes and dist-tag
        id: meta
        run: |
          node scripts/release-notes.mjs "${GITHUB_REF_NAME}" > "$RUNNER_TEMP/notes.md"
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "dist_tag=next" >> "$GITHUB_OUTPUT"
            echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack
        working-directory: packages/zeditor
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Publish to npm
        working-directory: packages/zeditor
        run: npm publish --provenance --access public --tag "${{ steps.meta.outputs.dist_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "$RUNNER_TEMP"/*.tgz \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag ${{ steps.meta.outputs.prerelease }}
