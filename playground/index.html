<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>zeditor playground</title>
    <link rel="stylesheet" href="./node_modules/@z-packages/zeditor/dist/style.css" />
    <script type="importmap">
      { "imports": { "@z-packages/zeditor": "./node_modules/@z-packages/zeditor/dist/zeditor.browser.js" } }
    </script>
    <style>
      :root { color-scheme: light dark; }
      [hidden] { display: none !important; }
      body { font-family: system-ui, sans-serif; margin: 0; background: #f3f4f6; color: #111827; }
      body.dark { background: #0d0f13; color: #e6e8ec; }
      header.app { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 16px; background: #111827; color: #fff; position: sticky; top: 0; z-index: 100; }
      header.app h1 { font-size: 16px; margin: 0 12px 0 0; }
      header.app label { font-size: 13px; display: inline-flex; gap: 4px; align-items: center; }
      header.app select, header.app button, .panel button, .panel select { font: inherit; font-size: 13px; padding: 4px 8px; border-radius: 6px; border: 1px solid #4b5563; background: #1f2937; color: #fff; cursor: pointer; }
      .panel button, .panel select { background: #fff; color: #111827; border-color: #d1d5db; }
      body.dark .panel button, body.dark .panel select { background: #1d2027; color: #e6e8ec; border-color: #30343d; }
      .layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; padding: 16px; align-items: start; }
      @media (max-width: 1000px) { .layout { grid-template-columns: 1fr; } }
      .panel { background: #fff; border: 1px solid #d9dde3; border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; font-size: 13px; }
      body.dark .panel { background: #15171c; border-color: #30343d; }
      .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; margin: 0 0 8px; color: #6b7280; }
      .toggles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2px 10px; }
      .row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; align-items: center; }
      pre.out { background: #111827; color: #e5e7eb; padding: 10px; border-radius: 6px; overflow: auto; max-height: 340px; font-size: 11.5px; margin: 6px 0 0; white-space: pre-wrap; word-break: break-word; }
      .panel [role=tab][aria-selected=true] { background: #2563eb !important; color: #fff !important; border-color: #2563eb !important; }
      #custom-toolbar { display: flex; gap: 6px; padding: 8px; border: 1px dashed #9ca3af; border-radius: 8px; margin-bottom: 8px; align-items: center; flex-wrap: wrap; }
      #custom-toolbar button[aria-pressed=true] { background: #7c3aed; color: #fff; border-color: #7c3aed; }
      /* customization example: re-theme through CSS variables only */
      .zeditor.brand { --z-accent: #7c3aed; --z-radius: 16px; --z-font: Georgia, 'Times New Roman', serif; --z-content-padding: 28px 64px; }
    </style>
  </head>
  <body>
    <header class="app">
      <h1>zeditor playground</h1>
      <label>Mode <select id="mode"><option value="classic">Classic</option><option value="block">Blocks</option></select></label>
      <label>Theme <select id="theme"><option>light</option><option>dark</option><option>auto</option></select></label>
      <label>Look <select id="look"><option value="default">Default</option><option value="brand">CSS-variable theme</option><option value="unstyled">Unstyled</option></select></label>
      <label>UI <select id="ui"><option value="default">Default controls</option><option value="custom">Custom toolbar (headless)</option><option value="none">No controls</option></select></label>
      <label><input type="checkbox" id="readonly" /> Read-only</label>
      <label><input type="checkbox" id="suggest" /> Suggesting</label>
      <button id="pages">Toggle pages</button>
      <button id="sample">Load sample</button>
    </header>

    <div class="layout">
      <div>
        <div id="custom-toolbar" hidden role="toolbar" aria-label="Custom toolbar built from public state and commands"></div>
        <div id="editor"></div>
      </div>
      <aside>
        <div class="panel">
          <h2>Features (rebuilds the editor)</h2>
          <div class="toggles" id="features"></div>
          <div class="row" style="margin-top:8px"><label>Character limit <input id="limit" type="number" min="0" step="100" value="0" style="width:80px" /></label></div>
        </div>
        <div class="panel">
          <h2>Import / export</h2>
          <div class="row">
            <button data-export="html">Copy HTML</button><button data-export="markdown">Copy Markdown</button><button data-export="json">Copy JSON</button>
          </div>
          <div class="row"><button id="import-html">Import HTML…</button><button id="import-md">Import Markdown…</button><button id="save-version">Save version</button><select id="versions" aria-label="Restore version"><option value="">Restore version…</option></select></div>
        </div>
        <div class="panel">
          <h2>Document inspector</h2>
          <div class="row" role="tablist" aria-label="Inspector view">
            <button role="tab" data-tab="json" aria-selected="true">JSON</button><button role="tab" data-tab="html" aria-selected="false">HTML</button><button role="tab" data-tab="markdown" aria-selected="false">Markdown</button><button role="tab" data-tab="state" aria-selected="false">State</button><button role="tab" data-tab="log" aria-selected="false">Steps</button>
          </div>
          <pre class="out" id="inspector" aria-live="off"></pre>
        </div>
        <div class="panel"><h2>Review</h2><div id="review"></div></div>
      </aside>
    </div>

    <script type="module">
      import * as Z from '@z-packages/zeditor';
      import { issueRefExtension, calloutExtension, SHARED_DOCUMENT } from '../examples/shared/extensions.js';

      const FEATURES = ['lists', 'code', 'tables', 'layout', 'media', 'equation', 'mentions', 'hashtag', 'emoji', 'markdownShortcuts', 'autolink', 'pages', 'comments', 'suggestions', 'database', 'notion'];
      const $ = (id) => document.getElementById(id);
      const state = { features: Object.fromEntries(FEATURES.map((f) => [f, true])), tab: 'json', log: [] };
      const KEY = 'zeditor-playground-v2';
      let z, review, comments, suggestions, versions;

      const isoIn = (days) => { const d = new Date(Date.now() + days * 86400000); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };


      /* ---------------- complex tables: merged cells, header column, colours, nested table ---------------- */
      function complexTables() {
        let n = 0;
        const id = (x) => 'ct-' + x + '-' + ++n;
        const P = (text, attrs) => ({ id: id('p'), type: 'paragraph', ...(attrs ? { attrs } : {}), content: typeof text === 'string' ? (text ? [{ text }] : []) : text });
        const cell = (content, attrs) => ({ id: id('c'), type: 'table_cell', ...(attrs ? { attrs } : {}), children: Array.isArray(content) ? content : [P(content, attrs?.align ? { align: attrs.align } : undefined)] });
        const row = (...cells) => ({ id: id('r'), type: 'table_row', children: cells.map(({ align, ...a }) => a) });
        const num = (v, extra = {}) => ({ ...cell(v, { align: 'right' }), attrs: { ...extra } , children: [P(v, { align: 'right' })] });
        const H = { header: true };
        const statement = {
          id: 'ct-statement', type: 'table', attrs: { colWidths: [200, 110, 110, 110, 110] },
          children: [
            row(cell('Line item', { ...H, rowspan: 2 }), cell('2025', { ...H, colspan: 2, align: 'center' }), cell('2026', { ...H, colspan: 2, align: 'center' })),
            row(cell('H1', { ...H, align: 'right' }), cell('H2', { ...H, align: 'right' }), cell('H1', { ...H, align: 'right' }), cell('H2', { ...H, align: 'right' })),
            row(cell('Revenue', H), num('1,200'), num('1,380'), num('1,450'), num('1,610', { background: '#e6f4ea' })),
            row(cell('Cost of sales', H), num('640'), num('700'), num('720'), num('760')),
            row(cell('Operating costs', H), num('310'), num('330'), num('350'), num('365')),
            row(cell([P([{ text: 'Profit', marks: { bold: true } }])], H), num([{ text: '250', marks: { bold: true } }], { background: '#fff3c4' }), num([{ text: '350', marks: { bold: true } }], { background: '#fff3c4' }), num([{ text: '380', marks: { bold: true } }], { background: '#fff3c4' }), num([{ text: '485', marks: { bold: true } }], { background: '#fff3c4' })),
          ],
        };
        const inner = {
          id: 'ct-inner', type: 'table',
          children: [
            row(cell('Region', H), cell('Share', { ...H, align: 'right' })),
            row(cell('Europe'), num('48 %')),
            row(cell('Americas'), num('37 %')),
            row(cell('Asia'), num('15 %')),
          ],
        };
        const notes = {
          id: 'ct-notes', type: 'table', attrs: { colWidths: [220, 0] },
          children: [
            row(cell('Topic', H), cell('Details', H)),
            row(cell('Revenue by region'), cell([P('A table inside a cell:'), inner])),
            row(cell('Risks'), cell([
              { id: id('l'), type: 'list', attrs: { kind: 'bullet' }, content: [{ text: 'Currency changes' }] },
              { id: id('l'), type: 'list', attrs: { kind: 'bullet' }, content: [{ text: 'Supplier prices' }] },
              { id: id('l'), type: 'list', attrs: { kind: 'check', checked: true }, content: [{ text: 'Hedging in place' }] },
            ])),
            row(cell('Formula'), cell([{ id: id('code'), type: 'code', attrs: { language: 'javascript' }, content: [{ text: 'profit = revenue - costOfSales - operatingCosts' }] }])),
          ],
        };
        return [
          { id: 'ct-h', type: 'heading', attrs: { level: 2 }, content: [{ text: 'Complex tables' }] },
          P('Cells can be merged across rows and columns (select cells, then "Merge" in the table tools), the first column can be a header column, cells can be coloured, and a cell can hold any block, including lists, code and another table. Put the caret in a cell and use Insert → Table to nest one.'),
          P([{ text: 'Half-year statement', marks: { bold: true } }]),
          statement,
          notes,
        ];
      }
      /* ---------------- database examples: what databases are for, ready to try ---------------- */
      const para = (id, ...parts) => ({ id, type: 'paragraph', content: parts.map((x) => (typeof x === 'string' ? { text: x } : x)) });
      const b = (text) => ({ text, marks: { bold: true } });
      const bullet = (id, ...parts) => ({ id, type: 'list', attrs: { kind: 'bullet' }, content: parts.map((x) => (typeof x === 'string' ? { text: x } : x)) });
      const howTo = (id, title, steps) => ({ id, type: 'callout', attrs: { tone: 'info', icon: '👉' }, children: [para(id + 't', b(title)), ...steps.map((st, i) => bullet(id + i, ...(Array.isArray(st) ? st : [st])))] });
      /** createDatabase + extra views (property names instead of ids) + notes inside rows */
      function makeDb(id, def) {
        const json = Z.createDatabase(Z.createHeadlessEditor(), { title: def.title, properties: def.properties, rows: def.rows, view: def.views[0].type });
        json.id = id;
        const pid = (name) => json.attrs.properties.find((x) => x.name === name)?.id;
        json.attrs.views = def.views.map((v, i) => {
          const out = { id: 'v' + (i + 1), name: v.name, type: v.type };
          if (v.groupBy) out.groupBy = pid(v.groupBy);
          if (v.dateProp) out.dateProp = pid(v.dateProp);
          if (v.endProp) out.endProp = pid(v.endProp);
          if (v.sorts) out.sorts = v.sorts.map(([n, dir]) => ({ prop: pid(n), dir }));
          if (v.filters) out.filters = v.filters.map(([n, op, value]) => ({ prop: pid(n), op, value }));
          if (v.hidden) out.hidden = v.hidden.map(pid);
          if (v.calc) out.calc = Object.fromEntries(Object.entries(v.calc).map(([n, c]) => [pid(n), c]));
          return out;
        });
        json.attrs.view = 'v1';
        json.children.forEach((row, i) => {
          row.id = id + '-r' + (i + 1);
          const notes = def.rows[i].notes;
          if (notes) row.children = notes.map((t, k) => para(row.id + 'n' + k, t));
        });
        return json;
      }
      function databaseExamples() {
        const tasks = makeDb('db-tasks', {
          title: 'Launch tasks',
          properties: [
            { name: 'Task', type: 'title' },
            { name: 'Status', type: 'select', options: [{ id: 'todo', name: 'To do', color: 'gray' }, { id: 'doing', name: 'In progress', color: 'blue' }, { id: 'done', name: 'Done', color: 'green' }] },
            { name: 'Owner', type: 'select', options: [{ id: 'ada', name: 'Ada', color: 'purple' }, { id: 'linus', name: 'Linus', color: 'orange' }, { id: 'grace', name: 'Grace', color: 'pink' }] },
            { name: 'Tags', type: 'multi_select', options: [{ id: 'ui', name: 'UI', color: 'pink' }, { id: 'docs', name: 'Docs', color: 'yellow' }, { id: 'infra', name: 'Infra', color: 'purple' }] },
            { name: 'Points', type: 'number' },
            { name: 'Start', type: 'date' },
            { name: 'Due', type: 'date' },
            { name: 'Shipped', type: 'checkbox' },
            { name: 'Effort', type: 'formula', formula: 'if(prop("Points") > 4, "Large", "Small") + " · " + prop("Points") * 2 + "h"' },
          ],
          rows: [
            { Task: 'Design the toolbar', Status: 'Done', Owner: 'Ada', Tags: ['UI'], Points: 3, Start: isoIn(-8), Due: isoIn(-3), Shipped: true, notes: ['Final icons are in the design file. Contrast checked in both themes.'] },
            { Task: 'Write the quick starts', Status: 'In progress', Owner: 'Grace', Tags: ['Docs'], Points: 5, Start: isoIn(-2), Due: isoIn(2), notes: ['Cover HTML, React and Vue. Each one must run in under five minutes.'] },
            { Task: 'Set up the relay server', Status: 'To do', Owner: 'Linus', Tags: ['Infra'], Points: 8, Start: isoIn(3), Due: isoIn(9) },
            { Task: 'Polish the block handles', Status: 'In progress', Owner: 'Ada', Tags: ['UI', 'Docs'], Points: 2, Start: isoIn(0), Due: isoIn(2) },
            { Task: 'Accessibility review', Status: 'To do', Owner: 'Grace', Tags: ['UI'], Points: 3, Start: isoIn(5), Due: isoIn(7) },
          ],
          views: [
            { name: 'All tasks', type: 'table', calc: { Points: 'sum', Shipped: 'percent_checked' } },
            { name: 'Board', type: 'board', groupBy: 'Status' },
            { name: 'By owner', type: 'list', groupBy: 'Owner', hidden: ['Owner', 'Points', 'Start', 'Shipped', 'Effort'] },
            { name: 'Calendar', type: 'calendar', dateProp: 'Due' },
            { name: 'Timeline', type: 'timeline', dateProp: 'Start', endProp: 'Due' },
            { name: 'Open work', type: 'table', filters: [['Status', 'is_not', 'Done']], sorts: [['Due', 'asc']] },
          ],
        });
        const content = makeDb('db-content', {
          title: 'Content calendar',
          properties: [
            { name: 'Post', type: 'title' },
            { name: 'Channel', type: 'select', options: [{ id: 'blog', name: 'Blog', color: 'blue' }, { id: 'news', name: 'Newsletter', color: 'green' }, { id: 'social', name: 'Social', color: 'pink' }] },
            { name: 'Stage', type: 'select', options: [{ id: 'idea', name: 'Idea', color: 'gray' }, { id: 'draft', name: 'Drafting', color: 'yellow' }, { id: 'ready', name: 'Ready', color: 'green' }] },
            { name: 'Publish on', type: 'date' },
            { name: 'Link', type: 'url' },
          ],
          rows: [
            { Post: 'Why we built zeditor', Channel: 'Blog', Stage: 'Ready', 'Publish on': isoIn(1), Link: 'example.com/why' },
            { Post: 'November product update', Channel: 'Newsletter', Stage: 'Drafting', 'Publish on': isoIn(4) },
            { Post: 'Databases in 60 seconds (video)', Channel: 'Social', Stage: 'Idea', 'Publish on': isoIn(6) },
            { Post: 'Migrating from another editor', Channel: 'Blog', Stage: 'Drafting', 'Publish on': isoIn(11) },
            { Post: 'Tips: keyboard shortcuts', Channel: 'Social', Stage: 'Ready', 'Publish on': isoIn(-2) },
          ],
          views: [
            { name: 'Calendar', type: 'calendar', dateProp: 'Publish on' },
            { name: 'Pipeline', type: 'board', groupBy: 'Stage' },
            { name: 'By channel', type: 'table', groupBy: 'Channel', sorts: [['Publish on', 'asc']] },
          ],
        });
        const books = makeDb('db-books', {
          title: 'Reading list',
          properties: [
            { name: 'Book', type: 'title' },
            { name: 'Author', type: 'text' },
            { name: 'Genre', type: 'multi_select', options: [{ id: 'sf', name: 'Science fiction', color: 'purple' }, { id: 'hist', name: 'History', color: 'brown' }, { id: 'tech', name: 'Technology', color: 'blue' }, { id: 'bio', name: 'Biography', color: 'orange' }] },
            { name: 'Rating', type: 'select', options: [{ id: 'r5', name: '★★★★★', color: 'yellow' }, { id: 'r4', name: '★★★★', color: 'yellow' }, { id: 'r3', name: '★★★', color: 'gray' }] },
            { name: 'Finished', type: 'checkbox' },
          ],
          rows: [
            { Book: 'The Left Hand of Darkness', Author: 'Ursula K. Le Guin', Genre: ['Science fiction'], Rating: '★★★★★', Finished: true, notes: ['A classic about a planet where people have no fixed gender. The ice crossing is unforgettable.'] },
            { Book: 'Hidden Figures', Author: 'Margot Lee Shetterly', Genre: ['History', 'Biography'], Rating: '★★★★', Finished: true, notes: ['The story of the women mathematicians at NASA Langley.'] },
            { Book: 'The Soul of a New Machine', Author: 'Tracy Kidder', Genre: ['Technology'], Rating: '★★★★', Finished: false, notes: ['Half way. The engineering-team chapters feel very familiar.'] },
            { Book: 'Project Hail Mary', Author: 'Andy Weir', Genre: ['Science fiction'], Finished: false },
          ],
          views: [
            { name: 'Shelf', type: 'gallery' },
            { name: 'Best first', type: 'table', sorts: [['Rating', 'asc']] },
            { name: 'To read', type: 'list', filters: [['Finished', 'unchecked', '']] },
          ],
        });
        const deals = makeDb('db-deals', {
          title: 'Deals',
          properties: [
            { name: 'Deal', type: 'title' },
            { name: 'Value', type: 'number' },
            { name: 'Stage', type: 'select', options: [{ id: 'lead', name: 'Lead', color: 'gray' }, { id: 'prop', name: 'Proposal', color: 'blue' }, { id: 'won', name: 'Won', color: 'green' }, { id: 'lost', name: 'Lost', color: 'red' }] },
          ],
          rows: [
            { Deal: 'Acme – 50 seats', Value: 12000, Stage: 'Won' },
            { Deal: 'Acme – support plan', Value: 3000, Stage: 'Proposal' },
            { Deal: 'Globex pilot', Value: 5000, Stage: 'Lead' },
            { Deal: 'Initech renewal', Value: 8000, Stage: 'Won' },
          ],
          views: [{ name: 'Pipeline', type: 'board', groupBy: 'Stage' }, { name: 'All deals', type: 'table', calc: { Value: 'sum' } }],
        });
        const companies = makeDb('db-companies', {
          title: 'Customers',
          properties: [
            { name: 'Company', type: 'title' },
            { name: 'Contact', type: 'email' },
            { name: 'Deals', type: 'relation', relation: { database: 'db-deals' } },
          ],
          rows: [
            { Company: 'Acme', Contact: 'buyer@acme.example', Deals: ['db-deals-r1', 'db-deals-r2'] },
            { Company: 'Globex', Contact: 'it@globex.example', Deals: ['db-deals-r3'] },
            { Company: 'Initech', Contact: 'ops@initech.example', Deals: ['db-deals-r4'] },
          ],
          views: [{ name: 'Customers', type: 'table' }],
        });
        // rollup: total value of each customer's deals (needs the ids created above)
        const rel = companies.attrs.properties.find((x) => x.name === 'Deals').id;
        const value = deals.attrs.properties.find((x) => x.name === 'Value').id;
        companies.attrs.properties.push({ id: 'ptotal', name: 'Total value', type: 'rollup', rollup: { relation: rel, target: value, calc: 'sum' } });
        companies.children.forEach((row, i) => (row.attrs.cells[rel] = [['db-deals-r1', 'db-deals-r2'], ['db-deals-r3'], ['db-deals-r4']][i]));

        return [
          { id: 'hdb', type: 'heading', attrs: { level: 2 }, content: [{ text: 'Databases: what they are for' }] },
          para('pdb1', 'A ', b('database'), ' is a list of items that share the same fields. A task has a status, an owner and a due date. A blog post has a channel and a publish date. A book has an author and a rating. Keep the items in a database instead of a plain table and you can:'),
          bullet('pdb2', b('look at the same items in different ways'), ': a ', b('table'), ' to edit, a ', b('board'), ' to drag cards between stages, a ', b('calendar'), ' or ', b('timeline'), ' to plan by date, a ', b('gallery'), ' of cards, or a compact ', b('list'), ';'),
          bullet('pdb3', b('filter, sort, group and search'), ' them (each view keeps its own settings);'),
          bullet('pdb4', b('open any item as a page'), ' and write notes inside it;'),
          bullet('pdb5', b('compute'), ' values: sums and averages under a table, formulas per item, totals from linked databases.'),
          para('pdb6', 'Each database below has several views set up already. Click the tabs under its title to switch between them.'),
          { id: 'toc', type: 'toc' },

          { id: 'h-tasks', type: 'heading', attrs: { level: 3 }, content: [{ text: '1. Task tracker' }] },
          howTo('how-tasks', 'Try this:', [
            ['Click ', b('Board'), ' and drag a card from "To do" to "Done". The Status changes in every view.'],
            ['Click ', b('Timeline'), ' and drag a bar sideways to reschedule it, or drag its right end to change the due date.'],
            ['Hover a row and click ', b('OPEN'), ' (or right-click → Open) to read the notes inside a task.'],
            ['Click ', b('+ New'), '. The new task appears highlighted in whichever view you are on.'],
            ['Use the ', b('🔍 search'), ', ', b('Filter'), ', ', b('Sort'), ' and ', b('Group'), ' buttons; "Open work" is a saved filtered view.'],
            ['Click a column header (e.g. ', b('Points'), ') to rename it, change its type, sort, or pick a calculation.'],
          ]),
          tasks,

          { id: 'h-content', type: 'heading', attrs: { level: 3 }, content: [{ text: '2. Content calendar' }] },
          howTo('how-content', 'Plan posts by date:', [
            ['Drag a post to another day on the ', b('Calendar'), ' to reschedule it. The "+" on a day adds a post for that date.'],
            ['Use ', b('Pipeline'), ' to move ideas through Idea → Drafting → Ready.'],
            [b('By channel'), ' is a table grouped by Channel; click a group header to fold it.'],
          ]),
          content,

          { id: 'h-books', type: 'heading', attrs: { level: 3 }, content: [{ text: '3. Reading list' }] },
          howTo('how-books', 'A gallery of pages:', [
            ['Each card shows the start of the notes written inside the book\'s page. Open a card to write more.'],
            [b('To read'), ' is the same list filtered to unfinished books; tick ', b('Finished'), ' and the book leaves that view.'],
          ]),
          books,

          { id: 'h-crm', type: 'heading', attrs: { level: 3 }, content: [{ text: '4. Customers and deals (linked databases)' }] },
          howTo('how-crm', 'Databases can point at each other:', [
            ['A ', b('relation'), ' property links rows of two databases: each customer lists its deals. Click a Deals cell to link or unlink deals.'],
            ['A ', b('rollup'), ' summarizes the linked rows: ', b('Total value'), ' adds up the Value of each customer\'s deals. Change a deal\'s value and watch it update.'],
          ]),
          companies,
          deals,
          para('pdb7', 'Developers: the same data is available from code (', { text: 'queryDatabase', marks: { code: true } }, ', ', { text: 'dbSetCell', marks: { code: true } }, ', block events). See docs/databases.md and docs/events-and-sync.md.'),
        ];
      }
      const sample = () => ({
        format: 'zeditor', version: 1,
        blocks: [
          { id: 'h1', type: 'heading', attrs: { level: 1 }, content: [{ text: 'zeditor playground' }] },
          { id: 'p1', type: 'paragraph', content: [{ text: 'One engine, two interfaces. Switch between ' }, { text: 'Classic', marks: { bold: true } }, { text: ' and ' }, { text: 'Blocks', marks: { bold: true } }, { text: ' in the header: the document, caret and undo history carry over. In Blocks mode type ' }, { text: '/', marks: { code: true } }, { text: ' for commands, ' }, { text: '@', marks: { code: true } }, { text: ' to mention, ' }, { text: '#', marks: { code: true } }, { text: ' for an issue, ' }, { text: ':rocket:', marks: { code: true } }, { text: ' for emoji.' }] },
          { id: 'l1', type: 'list', attrs: { kind: 'check', checked: true }, content: [{ text: 'Rich text, lists, tables, code, media' }] },
          { id: 'l2', type: 'list', attrs: { kind: 'check', checked: false }, content: [{ text: 'Try drag handles, the slash menu and table tools' }], children: [{ id: 'l3', type: 'list', attrs: { kind: 'bullet' }, content: [{ text: 'Nested with Tab / Shift+Tab' }] }] },
          { id: 'c1', type: 'code', attrs: { language: 'javascript' }, content: [{ text: 'import { createEditor } from "@z-packages/zeditor";\ncreateEditor({ element: "#editor" }); // that is all' }] },
          { id: 't1', type: 'table', children: [
            { id: 'r1', type: 'table_row', children: [{ id: 'k1', type: 'table_cell', attrs: { header: true }, children: [{ id: 'k1p', type: 'paragraph', content: [{ text: 'Feature' }] }] }, { id: 'k2', type: 'table_cell', attrs: { header: true }, children: [{ id: 'k2p', type: 'paragraph', content: [{ text: 'Try it' }] }] }] },
            { id: 'r2', type: 'table_row', children: [{ id: 'k3', type: 'table_cell', children: [{ id: 'k3p', type: 'paragraph', content: [{ text: 'Paste from a spreadsheet' }] }] }, { id: 'k4', type: 'table_cell', children: [{ id: 'k4p', type: 'paragraph', content: [{ text: 'Select cells, Tab, merge' }] }] }] },
          ] },
          ...complexTables(),
          { id: 'co', type: 'callout', attrs: { tone: 'info', icon: 'ℹ️' }, children: [{ id: 'cop', type: 'paragraph', content: [{ text: 'Callouts, toggles and columns hold ordinary blocks. Click the icon to change the tone.' }] }] },
          ...databaseExamples(),
          ...SHARED_DOCUMENT.blocks,
          { id: 'eq', type: 'equation', attrs: { tex: 'e^{i\\pi} + 1 = 0' } },
          { id: 'pz', type: 'paragraph', content: [{ text: 'Mixed scripts: नमस्ते दुनिया · שלום עולם · 👨‍👩‍👧‍👦 · é' }] },
        ],
      });

      // host adapters (all local fakes here)
      const people = ['Ada Lovelace', 'Alan Turing', 'Grace Hopper', 'Katherine Johnson', 'Linus Torvalds', 'Margaret Hamilton'];
      const searchPeople = (q, { signal }) => new Promise((resolve, reject) => {
        const t = setTimeout(() => resolve(people.filter((p) => p.toLowerCase().includes(q.toLowerCase())).map((p) => ({ id: p.toLowerCase().replace(/\s+/g, '.'), label: p }))), 150);
        signal.addEventListener('abort', () => { clearTimeout(t); reject(new DOMException('aborted', 'AbortError')); });
      });
      const fakeUpload = (file, { signal, onProgress }) => new Promise((resolve, reject) => {
        let p = 0;
        const t = setInterval(() => {
          p += 0.2; onProgress(Math.min(1, p));
          if (p >= 1) { clearInterval(t); const r = new FileReader(); r.onload = () => resolve({ url: r.result, name: file.name }); r.readAsDataURL(file); }
        }, 250);
        signal.addEventListener('abort', () => { clearInterval(t); reject(new DOMException('aborted', 'AbortError')); });
      });

      function build(content) {
        const keep = content ?? z?.getJSON() ?? JSON.parse(localStorage.getItem(KEY) ?? 'null') ?? sample();
        review?.destroy(); comments?.destroy(); suggestions?.destroy(); z?.destroy();
        const look = $('look').value, ui = $('ui').value, limit = +$('limit').value || undefined;
        z = Z.createEditor({
          element: '#editor',
          content: keep,
          mode: $('mode').value,
          theme: $('theme').value,
          unstyled: look === 'unstyled',
          readOnly: $('readonly').checked,
          features: state.features,
          characterLimit: limit,
          mentions: { search: searchPeople },
          upload: fakeUpload,
          linkPreview: async (url) => ({ title: new URL(url).hostname, description: 'Preview supplied by the host application for ' + url, site: new URL(url).hostname }),
          extensions: [Z.codeHighlightExtension(), issueRefExtension(), calloutExtension()],
          ui: ui === 'none' ? false : { statusBar: true, toolbar: ui === 'default' },
          autosave: { debounce: 600, draftKey: KEY + ':draft', save: async (doc) => { await new Promise((r) => setTimeout(r, 300)); localStorage.setItem(KEY, JSON.stringify(doc)); } },
          maxHeight: '75vh',
        });
        window.z = z;
        z.element.classList.toggle('brand', look === 'brand');
        document.body.classList.toggle('dark', $('theme').value === 'dark');
        const user = { id: 'me', name: 'You' };
        comments = state.features.comments ? Z.createComments(z.editor, { user }) : null;
        suggestions = state.features.suggestions ? Z.createSuggestions(z.editor, { user }) : null;
        $('review').textContent = '';
        review = comments || suggestions ? Z.createReviewPanel(z.editor, $('review'), { comments: comments ?? undefined, suggestions: suggestions ?? undefined }) : null;
        if (suggestions) suggestions.setSuggesting($('suggest').checked);
        versions = Z.createVersions(z.editor, { store: versionStore });
        z.editor.on('transaction', (ev) => { if (ev.docChanged) { state.log.unshift({ origin: ev.origin, steps: ev.tr.steps.map((s) => s.t === 'text' ? `text ${s.id} [${s.from},${s.to}) +${JSON.stringify(s.insert).slice(0, 60)}` : s.t === 'attrs' ? `attrs ${s.id} ${s.type ?? ''}` : `${s.t} @${s.parent}[${s.index}] ${s.t === 'insert' ? s.blocks.map((b) => b.type).join(',') : 'x' + s.count}`) }); state.log.length = Math.min(state.log.length, 30); } });
        z.subscribe(inspect);
        customToolbar(ui === 'custom');
        inspect();
      }
      const versionStore = Z.memoryVersionStore();

      // "headless" example: a toolbar rendered by the host from getState() + commands only
      function customToolbar(on) {
        const el = $('custom-toolbar');
        el.hidden = !on;
        el.textContent = '';
        if (!on) return;
        const btn = (label, run, pressed) => {
          const b = document.createElement('button');
          b.textContent = label;
          b.onmousedown = (e) => e.preventDefault();
          b.onclick = () => { run(); z.focus(); };
          el.append(b);
          return () => pressed && b.setAttribute('aria-pressed', String(!!pressed(z.getState())));
        };
        const updaters = [
          btn('B', () => z.commands.toggleMark('bold'), (s) => s.marks.bold),
          btn('I', () => z.commands.toggleMark('italic'), (s) => s.marks.italic),
          btn('H2', () => z.commands.toggleBlockType('heading', { level: 2 }), (s) => s.blockType === 'heading' && s.blockAttrs.level === 2),
          btn('• List', () => z.commands.toggleBlockType('list', { kind: 'bullet' }), (s) => s.blockType === 'list'),
          btn('Undo', () => z.commands.undo()),
          btn('Redo', () => z.commands.redo()),
        ];
        const info = document.createElement('span');
        el.append(info);
        const update = () => { updaters.forEach((u) => u()); const s = z.getState(); info.textContent = ` ${s.blockType ?? '–'} · rev ${s.revision}${s.canUndo ? ' · can undo' : ''}`; };
        z.subscribe(update); update();
      }

      let timer;
      function inspect() {
        clearTimeout(timer);
        timer = setTimeout(() => {
          const e = z.editor;
          const out = $('inspector');
          if (state.tab === 'json') out.textContent = JSON.stringify(z.getJSON(), null, 1);
          else if (state.tab === 'html') out.textContent = Z.toHTML(e).replace(/></g, '>\n<');
          else if (state.tab === 'markdown') out.textContent = Z.toMarkdown(e);
          else if (state.tab === 'state') out.textContent = JSON.stringify({ ...z.getState(), counts: Z.getCounts(e), extensions: e.extensions.map((x) => x.name), autosave: z.autosave?.status }, null, 1);
          else out.textContent = state.log.map((l) => `[${l.origin}]\n  ` + l.steps.join('\n  ')).join('\n') || '(edit the document to see transaction steps)';
        }, 120);
      }

      for (const f of FEATURES) {
        const label = document.createElement('label');
        const cb = document.createElement('input');
        cb.type = 'checkbox'; cb.checked = true;
        cb.onchange = () => { state.features[f] = cb.checked; build(); };
        label.append(cb, ' ' + f);
        $('features').append(label);
      }
      $('mode').onchange = () => { z.setMode($('mode').value); z.focus(); };
      $('readonly').onchange = () => z.setReadOnly($('readonly').checked);
      $('suggest').onchange = () => suggestions?.setSuggesting($('suggest').checked);
      for (const id of ['theme', 'look', 'ui', 'limit']) $(id).onchange = () => build();
      $('pages').onclick = () => { if (!z.commands.enablePages?.()) z.commands.disablePages?.(); z.focus(); };
      $('sample').onclick = () => build(sample());
      document.querySelectorAll('[data-tab]').forEach((b) => (b.onclick = () => { state.tab = b.dataset.tab; document.querySelectorAll('[data-tab]').forEach((x) => x.setAttribute('aria-selected', String(x === b))); inspect(); }));
      document.querySelectorAll('[data-export]').forEach((b) => (b.onclick = () => {
        const k = b.dataset.export;
        const text = k === 'html' ? Z.toHTML(z.editor) : k === 'markdown' ? Z.toMarkdown(z.editor) : JSON.stringify(z.getJSON(), null, 2);
        navigator.clipboard?.writeText(text); b.textContent = 'Copied'; setTimeout(() => (b.textContent = 'Copy ' + (k === 'json' ? 'JSON' : k === 'html' ? 'HTML' : 'Markdown')), 900);
      }));
      $('import-html').onclick = () => { const s = prompt('Paste HTML to import (it is sanitized):', '<h2>Imported</h2><p>Hello <b>world</b> <img src=x onerror=alert(1)></p>'); if (s != null) Z.setHTML(z.editor, s, { history: true }); };
      $('import-md').onclick = () => { const s = prompt('Paste Markdown to import:', '## Imported\n\n- [x] done\n- [ ] todo\n\n| a | b |\n|---|---|\n| 1 | 2 |'); if (s != null) Z.setMarkdown(z.editor, s, { history: true }); };
      $('save-version').onclick = async () => { const v = await versions.save('Version ' + new Date().toLocaleTimeString()); $('versions').append(new Option(v.label, v.id)); };
      $('versions').onchange = async () => { const id = $('versions').value; $('versions').value = ''; if (id) await versions.restore(id); };

      build();
    </script>
  </body>
</html>
